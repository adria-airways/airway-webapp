name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        run: |
          docker buildx build --platform linux/amd64 -f apps/api/Dockerfile.prod -t mrnejco/airway-api:latest --push .

      - name: Build and push WEB
        run: |
          docker buildx build --platform linux/amd64 -f apps/web/Dockerfile.prod -t mrnejco/airway-web:latest --push .

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger webhook
        run: |
          curl -X POST "${{ secrets.WEBHOOK_URL }}" \
          -H "X-Deploy-Secret: ${{ secrets.WEBHOOK_SECRET }}"
